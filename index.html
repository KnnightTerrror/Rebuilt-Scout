<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REBUILT Scout</title>
<meta name="description" content="Scouting app for the FRC 2026 game REBUILT: match and pit scouting, rankings, picklist and pre-match briefs.">
<meta name="theme-color" content="#14181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky top bar, one scrolling view, fixed bottom tab bar. Steel neutrals, FUEL-yellow accent, alliance red/blue as semantic. */
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface-2:#f4f6f8; --line:#d3d9df; --fg:#14181d; --muted:#5b6672;
  --accent:#f2b705; --accent-ink:#1a1400; --accent-soft:#fdf1c4;
  --red:#c8323a; --red-soft:#f8dfe0; --blue:#1f5fbf; --blue-soft:#dce7f8;
  --good:#1d8a4e; --good-soft:#d9f0e2; --warn:#b26a00; --warn-soft:#fbe9cc; --bad:#c8323a; --bad-soft:#f8dfe0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#181c22; --surface-2:#1f242b; --line:#2c333c; --fg:#e8ecf0; --muted:#97a2ae;
  --accent:#f5c22b; --accent-ink:#1a1400; --accent-soft:#3a3210;
  --red:#ff6b72; --red-soft:#3d1c1f; --blue:#6fa2ff; --blue-soft:#18273f;
  --good:#4cc782; --good-soft:#163323; --warn:#f0a53a; --warn-soft:#3a2a12; --bad:#ff6b72; --bad-soft:#3d1c1f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181c22; --surface-2:#1f242b; --line:#2c333c; --fg:#e8ecf0; --muted:#97a2ae;
  --accent:#f5c22b; --accent-ink:#1a1400; --accent-soft:#3a3210;
  --red:#ff6b72; --red-soft:#3d1c1f; --blue:#6fa2ff; --blue-soft:#18273f;
  --good:#4cc782; --good-soft:#163323; --warn:#f0a53a; --warn-soft:#3a2a12; --bad:#ff6b72; --bad-soft:#3d1c1f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
p{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.brand h1 b{background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:4px}
.evt{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
.nav button{border:0;background:none;padding:6px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--fg);background:var(--accent-soft)}
.nav button[aria-current="page"] svg{color:var(--accent)}

main{padding-block:16px 24px}
.view{display:grid;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-h h2{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sec-h .tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.page-h{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stack{display:grid;gap:4px;align-content:start;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);font-size:16px}
textarea{min-height:84px;resize:vertical}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.legend{font-size:13px;color:var(--muted)}
code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* sub tabs */
.subnav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto}
.subnav button{flex:1 0 auto;border:0;background:none;border-radius:999px;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.subnav button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--f-display);font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:12px 18px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* segmented picks */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:64px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 10px;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg.red button[aria-pressed="true"][data-v="red"]{background:var(--red);border-color:var(--red);color:#fff}
.seg.red button[aria-pressed="true"][data-v="blue"]{background:var(--blue);border-color:var(--blue);color:#fff}
.tog{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;font-size:14px}
.tog::before{content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);flex:none}
.tog[aria-pressed="true"]{border-color:var(--fg)}
.tog[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface-2)}
.tog.badtog[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tog.badtog[aria-pressed="true"]::before{background:var(--bad);border-color:var(--bad)}

/* counters */
.counter{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px}
.counter .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.counter .ch span{font-weight:600;font-size:14px}
.counter .val{font-family:var(--f-mono);font-size:30px;font-weight:700;line-height:1}
.counter .btns{display:grid;gap:6px}
.counter .btns button{border:0;border-radius:8px;padding:14px 4px;font-family:var(--f-mono);font-weight:700;font-size:17px;cursor:pointer;background:var(--accent);color:var(--accent-ink);touch-action:manipulation}
.counter .btns button.minus{background:var(--surface);border:1px solid var(--line);color:var(--fg);padding-inline:14px}
.counter.missc .btns button:not(.minus){background:var(--fg);color:var(--bg)}

/* rating */
.rate{display:grid;grid-template-columns:minmax(110px,150px) 1fr;align-items:center;gap:8px}
.rate .seg button{min-width:40px;padding:9px 0;font-family:var(--f-mono)}
.rate .seg button[data-v="0"]{font-family:var(--f-body);font-size:12px;min-width:44px}
.rate .seg button[aria-pressed="true"]:not([data-v="0"]){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* timer + assignment card */
.timer{display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:10px 14px;flex-wrap:wrap}
.timer .t{font-family:var(--f-mono);font-size:28px;font-weight:700}
.timer .ph{font-family:var(--f-display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.timer .bar{flex:1 1 100%;height:6px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:3px;overflow:hidden;display:flex}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer .btn{margin-left:auto;background:var(--accent);color:var(--accent-ink);border:0}
.assign{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px}
.assign .big{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.assign .btn{margin-left:auto}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);user-select:none}
th[data-sort]{cursor:pointer}
th.l,td.l{text-align:left}
th[aria-sort]{color:var(--fg)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.best{background:var(--good-soft);color:var(--good);font-weight:700}
tr.ours td{background:var(--accent-soft)}
.team-n{font-family:var(--f-mono);font-weight:700;font-size:15px}
.tn-red{color:var(--red)} .tn-blue{color:var(--blue)}
.score{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.score .sb{width:54px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.score .sb i{display:block;height:100%;background:var(--accent)}
.rk{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:left}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);border-color:transparent}

/* team detail */
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:flex-end}
.panel{width:min(680px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.ph-head{display:flex;align-items:flex-start;gap:12px}
.ph-head .big{font-family:var(--f-mono);font-size:40px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:700}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.barrow .track{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--accent)}
.notes{display:grid;gap:8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.note.weakness{border-left:4px solid var(--bad)}
.note.strength{border-left:4px solid var(--good)}
.note.strategy{border-left:4px solid var(--blue)}
.note .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}

/* charts */
.chart{display:grid;gap:6px;min-width:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .dl{fill:var(--fg);font-family:var(--f-mono);font-size:12px;font-weight:700}
.chart .avg{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.chart .hit{fill:transparent;cursor:crosshair}
.keys{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:12px;height:12px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;max-width:260px}

/* alliances / brief */
.alli{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.acol{display:grid;gap:10px;align-content:start;min-width:0}
.ahead{border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.ahead.red{background:var(--red-soft);border:1px solid var(--red)}
.ahead.blue{background:var(--blue-soft);border:1px solid var(--blue)}
.ahead h3{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.ahead.red h3{color:var(--red)} .ahead.blue h3{color:var(--blue)}
.ahead .pts{font-family:var(--f-mono);font-size:30px;font-weight:700}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;cursor:pointer;min-width:0}
.tcard:hover{border-color:var(--muted)}
.tcard.ours{border:2px solid var(--accent)}
.tcard .tt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tcard .kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.tcard .kv b{font-family:var(--f-mono)}
.tcard .wk{font-size:13px;border-left:3px solid var(--bad);padding-left:8px;overflow-wrap:anywhere}

/* picklist */
.pl{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.pl li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.pl li .pos{font-family:var(--f-display);font-weight:800;font-size:20px;width:30px}
.pl li .info{flex:1;min-width:140px}
.pl li.dnp{opacity:.6}
.pl li.dnp .team-n{text-decoration:line-through}

/* flags */
.flags{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.flags li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:8px 10px;cursor:pointer}
.flags li:hover{outline:1px solid var(--line)}

/* transfer */
.qrwrap{display:grid;gap:10px;justify-items:center}
.qr{width:min(100%,360px);image-rendering:pixelated;background:#fff;border-radius:8px;padding:6px}
video.scan{width:100%;max-width:420px;border-radius:var(--r);background:#000;justify-self:center}

.empty{padding:28px 16px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.empty h3{font-size:22px;color:var(--fg)}
.empty p{max-width:60ch}
.banner{border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .btn{margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
details summary{cursor:pointer;font-weight:600}
@media (max-width:520px){
  .brand h1{font-size:20px}
  .rate{grid-template-columns:1fr}
  .barrow{grid-template-columns:96px 1fr 36px}
  .subnav button{font-size:14px;padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1><b>REBUILT</b> Scout</h1></div>
    <div class="evt">
      <span class="chip" title="Current event">Event: <span class="mono" id="evtName">—</span></span>
      <span class="chip" id="syncChip"><span class="dot"></span><span id="syncTxt">Connecting…</span></span>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="nav" aria-label="Sections">
  <div class="wrap">
    <button data-tab="scout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Scout</button>
    <button data-tab="teams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Teams</button>
    <button data-tab="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Matches</button>
    <button data-tab="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Picklist</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </div>
</nav>

<div id="overlayRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<div id="tip" hidden></div>

<script src="config.js"></script>
<script>
(() => {
"use strict";

// ---------- constants ----------

const NUM_CFG = ["fuelAuto","fuelTele","autoClimb","L1","L2","L3","wPts","wRate","wRel","rpFuel1","rpFuel2","rpTower"];
const RATINGS = [["r_shooter","Shooter"],["r_intake","Intake speed"],["r_storage","Storage / capacity"],["r_accuracy","Accuracy"],["r_driving","Driving"],["r_defense","Defense"],["r_climber","Climber"]];

const BOOLF = new Set(["noShow","autoLeave","autoClimb","defense","bump","trench","m_died","m_stuck","m_tipped","m_broke"]);

};

// ---------- persistence: shared db + on-device queue ----------
function remote(op, path, data){ const ref=S.db.doc(path); return op==="set" ? ref.set(data) : ref.delete(); }
function writeErr(e){
  const c = e && e.code;
  if(c==="invalid_argument" || c==="permission-denied"){
    if(S.backend==="claude"){ S.readOnly=true; setSync(); toast("You can't save to the shared data. Ask the app owner for Contributor access."); }
    else toast("The team database refused that save. Check the team code in More → Setup.");
    return;
  }
  if(c==="quota_exceeded" || c==="resource-exhausted"){ toast("The shared database is full or over today's limit. Export a backup in More → Setup."); return; }
  toast("Couldn't save: " + ((e && e.message) || "unknown error"));
}
function enqueue(op, path, data){ S.queue = S.queue.filter(x => x.path!==path); S.queue.push({op, path, data}); ls.set("queue", S.queue); S.ver++; setSync(); }
async function write(op, path, data){
  S.ver++;
  if(S.db && S.backend==="firebase"){
    // Firestore keeps its own offline queue and shows local writes in snapshots right away
    S.pending++; setSync();
    remote(op, path, data).then(()=>{ S.pending--; setSync(); }, e=>{ S.pending--; setSync(); writeErr(e); });
    return navigator.onLine ? true : "queued";
  }
  if(S.db){
    try{ await remote(op, path, data); return true; }
    catch(e){ if(e && ["invalid_argument","quota_exceeded"].includes(e.code)){ writeErr(e); return false; } }
  }
  enqueue(op, path, data);
  return S.backend==="local" && !S.connecting ? "local" : "queued";
}
let flushing = false;
async function flush(){
  if(!S.db || flushing || !S.queue.length) return;
  flushing = true;
  try{
    while(S.queue.length){
      const it = S.queue[0];
      if(S.backend==="firebase") remote(it.op, it.path, it.data).catch(writeErr);
      else { try{ await remote(it.op, it.path, it.data); } catch(e){ if(e && e.code==="invalid_argument") S.readOnly=true; break; } }
      S.queue.shift(); ls.set("queue", S.queue);
    }
  } finally { flushing=false; S.ver++; setSync(); renderSoft(); }
}
setInterval(()=>{ if(S.queue.length) flush(); }, 30000);
addEventListener("online", ()=>{ setSync(); if(SITE && HAS_FB && S.wkey && !S.db) initFirebase(); flush(); });
addEventListener("offline", setSync);

// shared docs merged with anything still waiting on this device
function coll(name){
  const out = new Map(S.c[name]);
  S.queue.forEach(q => { const i=q.path.indexOf("/"); const c=q.path.slice(0,i), id=q.path.slice(i+1);
    if(c===name){ if(q.op==="set") out.set(id, {...q.data, id:q.data.id||id}); else out.delete(id); } });
  return out;
}
const entriesNow = () => [...coll("entries").values()].filter(e => S.showAll || e.event===S.event);
const teamsNow = () => coll("teams");
const notesNow = () => [...coll("notes").values()];
const cfg = () => ({...DEFAULT_CFG, ...S.cfg});
const scheduleFor = () => coll("schedule").get(evKey()) || null;
const rosterFor = () => coll("roster").get(evKey()) || {scouts:[], shift:6};
function teamName(t){
  t = String(t); const p = teamsNow().get(t); if(p && p.name) return p.name;
  for(const s of coll("schedule").values()){ if(s.names && s.names[t]) return s.names[t]; }
  return "";
}
const teamAt = (m, p) => String((p[0]==="R" ? m.red : m.blue)[num(p[1])-1] || "");
const played = m => m.rs!=null && m.rs>=0;

// ---------- scoring ----------
function climbPts(c, C){ return c==="L1"?C.L1 : c==="L2"?C.L2 : c==="L3"?C.L3 : 0; }
function entryPts(e, C=cfg()){
  if(e.noShow) return 0;
  return num(e.autoFuel)*C.fuelAuto + (e.autoClimb?C.autoClimb:0) + num(e.teleFuel)*C.fuelTele + climbPts(e.climb, C);
}
function agg(team, list, C=cfg()){
  const es = list.filter(e => String(e.team)===String(team));
  const pl = es.filter(e => !e.noShow);
  const r = { team:String(team), n:es.length, played:pl.length };
  r.pts = avg(pl.map(e=>entryPts(e,C)));
  r.auto = avg(pl.map(e=>num(e.autoFuel)*C.fuelAuto + (e.autoClimb?C.autoClimb:0)));
  r.fuel = avg(pl.map(e=>num(e.autoFuel)+num(e.teleFuel)));
  r.tower = avg(pl.map(e=>(e.autoClimb?C.autoClimb:0)+climbPts(e.climb,C)));
  const vol = pl.filter(e=>num(e.volleys)>0);
  r.perVolley = vol.length ? avg(vol.map(e=>num(e.teleFuel)/num(e.volleys))) : null;
  const sc = sum(pl.map(e=>num(e.autoFuel)+num(e.teleFuel))), ms = sum(pl.map(e=>num(e.autoMiss)+num(e.teleMiss)));
  r.acc = sc+ms ? sc/(sc+ms) : null;
  r.climbRate = pl.length ? pl.filter(e=>["L1","L2","L3"].includes(e.climb)).length/pl.length : null;
  const order = {none:0,fail:0,L1:1,L2:2,L3:3}; r.bestClimb = pl.reduce((b,e)=> (order[e.climb]||0)>order[b]?e.climb:b, "none");
  r.ratings = {}; RATINGS.forEach(([k]) => r.ratings[k] = avg(pl.map(e=>num(e[k])).filter(v=>v>0)));
  r.rating = avg(Object.values(r.ratings).filter(v=>v!=null));
  const bad = e => e.noShow || e.m_died || e.m_stuck || e.m_tipped || e.m_broke || (e.broken||[]).length;
  r.issues = es.length ? es.filter(bad).length/es.length : null;
  r.mal = { noShow:es.filter(e=>e.noShow).length, died:es.filter(e=>e.m_died).length, stuck:es.filter(e=>e.m_stuck).length, tipped:es.filter(e=>e.m_tipped).length, broke:es.filter(e=>e.m_broke).length, fouls:sum(es.map(e=>num(e.fouls))) };
  r.brokenMechs = {}; es.forEach(e => (e.broken||[]).forEach(m => r.brokenMechs[m]=(r.brokenMechs[m]||0)+1));
  r.flow = mode(es.map(e=>e.flow)); r.aim = mode(es.map(e=>e.aim)); r.drive = mode(es.map(e=>e.drive));
  r.defense = es.filter(e=>e.defense).length;
  const byM = new Map(); pl.forEach(e => { const k=num(e.match); if(!byM.has(k)) byM.set(k,[]); byM.get(k).push(e); });
  r.series = [...byM.entries()].sort((a,b)=>a[0]-b[0]).map(([m,g]) => ({x:m, y:avg(g.map(e=>entryPts(e,C))), fuel:avg(g.map(e=>num(e.autoFuel)+num(e.teleFuel))), climb:g[0].climb}));
  return r;
}
let rankCache = {k:null, v:null};
function rankAll(){
  const key = [S.ver, S.event, S.showAll, JSON.stringify(S.cfg)].join("|");
  if(rankCache.k===key) return rankCache.v;
  const list = entriesNow(); const C = cfg();
  const nums = new Set(list.map(e=>String(e.team)));
  if(!S.showAll) teamsNow().forEach((t,k)=>{ if(Array.isArray(t.events) && t.events.includes(S.event)) nums.add(String(k)); });
  const rows = [...nums].filter(Boolean).map(t => agg(t, list, C));
  const maxPts = Math.max(1, ...rows.map(r=>r.pts||0));
  const wsum = Math.max(1, C.wPts + C.wRate + C.wRel);
  rows.forEach(r => {
    if(!r.n){ r.score=null; return; }
    const p = (r.pts||0)/maxPts*100, q = r.rating!=null ? (r.rating-1)/4*100 : 50, rel = (1-(r.issues||0))*100;
    r.score = (p*C.wPts + q*C.wRate + rel*C.wRel)/wsum;
  });
  rows.sort((a,b)=>(b.score??-1)-(a.score??-1));
  rows.forEach((r,i)=> r.rank = r.score==null ? null : i+1);
  rankCache = {k:key, v:rows};
  return rows;
}
const rankMap = () => Object.fromEntries(rankAll().map(r=>[r.team, r]));
const statsFor = t => rankMap()[String(t)] || agg(String(t), entriesNow());

// ---------- scout assignments ----------
function assignments(){
  const sch = scheduleFor(), ro = rosterFor(), out = new Map();
  const scouts = (ro.scouts||[]).filter(Boolean); if(!sch || !scouts.length) return out;
  const n = scouts.length, shift = Math.max(1, num(ro.shift)||6);
  [...sch.matches].sort((a,b)=>a.n-b.n).forEach((m,i) => {
    const b = Math.floor(i/shift), a = {};
    if(n >= 6) POS.forEach((p,j) => a[p] = scouts[(b*6+j)%n]);
    else scouts.forEach((s,k) => a[POS[(k+b)%6]] = s);
    out.set(m.n, a);
  });
  return out;
}
function nextAssignment(name){
  const sch = scheduleFor(); if(!name || !sch) return null;
  const A = assignments(); if(!A.size) return null;
  const done = new Set(entriesNow().filter(e=>norm(e.scoutName)===norm(name)).map(e=>num(e.match)));
  for(const m of [...sch.matches].sort((a,b)=>a.n-b.n)){
    const a = A.get(m.n); if(!a) continue;
    const p = POS.find(p => norm(a[p])===norm(name)); if(!p) continue;
    if(done.has(m.n) || played(m)) continue;
    return {m, p, team:teamAt(m,p)};
  }
  return null;
}

// ---------- data quality ----------
function quality(){
  const C = cfg(), es = entriesNow(), out = {missing:[], disagree:[], outliers:[], official:[], scouts:[]};
  const fuel = e => num(e.autoFuel)+num(e.teleFuel);
  const byMT = new Map(), byT = new Map();
  es.forEach(e => { const k=num(e.match)+"|"+e.team; if(!byMT.has(k)) byMT.set(k,[]); byMT.get(k).push(e); if(!byT.has(e.team)) byT.set(e.team,[]); byT.get(e.team).push(e); });
  const flags = {}; const flag = n => { const k=n||"Unknown"; flags[k]=(flags[k]||0)+1; };
  byMT.forEach(g => {
    if(g.length<2) return;
    const f = g.map(fuel), lo = Math.min(...f), hi = Math.max(...f), cl = new Set(g.map(e=>e.climb||"none")), reasons = [];
    if(hi-lo > Math.max(5, .25*hi)) reasons.push(`fuel ${f.join(" vs ")}`);
    if(cl.size>1) reasons.push(`climb ${[...cl].map(c=>LBL[c]||c).join(" vs ")}`);
    if(g.some(e=>e.noShow) && !g.every(e=>e.noShow)) reasons.push("no-show");
    if(reasons.length){ out.disagree.push({match:num(g[0].match), team:g[0].team, scouts:g.map(e=>e.scoutName||"?"), reasons}); g.forEach(e=>flag(e.scoutName)); }
  });
  es.forEach(e => {
    if(e.noShow) return;
    const others = (byT.get(e.team)||[]).filter(o => o!==e && !o.noShow && num(o.match)!==num(e.match));
    if(others.length<3) return;
    const v = others.map(o=>entryPts(o,C)), m = avg(v), sd = Math.sqrt(avg(v.map(x=>(x-m)**2))), p = entryPts(e,C);
    if(Math.abs(p-m) > Math.max(15, 2.5*sd)){ out.outliers.push({e, p, m}); flag(e.scoutName); }
  });
  const sch = scheduleFor();
  if(sch){
    const maxM = Math.max(0, ...es.map(e=>num(e.match))), A = assignments();
    [...sch.matches].sort((a,b)=>a.n-b.n).forEach(m => {
      if(!(played(m) || m.n<=maxM)) return;
      POS.forEach(p => { const t=teamAt(m,p); if(t && !byMT.has(m.n+"|"+t)) out.missing.push({match:m.n, pos:p, team:t, scout:(A.get(m.n)||{})[p]||null}); });
      ["red","blue"].forEach(al => {
        const off = al==="red" ? m.rs : m.bs; if(off==null || off<0) return;
        const per = m[al].map(t => { const g=byMT.get(m.n+"|"+t); return g ? avg(g.map(e=>entryPts(e,C))) : null; });
        if(per.some(x=>x==null)) return;
        const sc = sum(per); if(Math.abs(sc-off) > Math.max(20, .3*off)) out.official.push({match:m.n, al, sc, off});
      });
    });
  }
  const byS = new Map();
  es.forEach(e => { const k=e.scoutName||"Unknown"; if(!byS.has(k)) byS.set(k,[]); byS.get(k).push(e); });
  byS.forEach((g,name) => {
    const devs = g.map(e => { const o=(byT.get(e.team)||[]).filter(x=>x!==e && norm(x.scoutName)!==norm(name) && !x.noShow); return o.length>=2 && !e.noShow ? Math.abs(fuel(e)-avg(o.map(fuel))) : null; }).filter(x=>x!=null);
    out.scouts.push({name, n:g.length, dev:avg(devs), flags:flags[name]||0});
  });
  out.scouts.sort((a,b)=>b.n-a.n);
  return out;
}

// ---------- rendering ----------
function setTab(t){ S.tab=t; ls.set("tab",t); markNav(); render(); scrollTo(0,0); }
function setSub(tab, s){ S.sub[tab]=s; ls.set("sub", S.sub); render(); scrollTo(0,0); }
function markNav(){ document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===S.tab?"page":"false")); }
function render(){
  setSync();
  if(S.scan && !(S.tab==="more" && S.sub.more==="transfer")) stopScan();
  const m = $("#main"), sub = S.sub[S.tab];
  S.dirty = false;
  if(S.tab==="scout") m.innerHTML = subnav("scout",[["match","Match"],["pit","Pit"]]) + (sub==="pit" ? vPit() : vScout());
  else if(S.tab==="teams") m.innerHTML = subnav("teams",[["rank","Rankings"],["compare","Compare"]]) + (sub==="compare" ? vCompare() : vRank());
  else if(S.tab==="matches") m.innerHTML = subnav("matches",[["schedule","Schedule"],["brief","Pre-match"],["scouts","Scouts"]]) + (sub==="brief" ? vBrief() : sub==="scouts" ? vScouts() : vSchedule());
  else if(S.tab==="pick") m.innerHTML = vPick();
  else m.innerHTML = subnav("more",[["check","Data check"],["transfer","QR transfer"],["setup","Setup"]]) + (sub==="check" ? vCheck() : sub==="transfer" ? vTransfer() : vSetup());
  if(S.tab==="more" && sub==="transfer") renderQR();
  renderTeam();
}
const isTyping = root => { const a=document.activeElement; return !!(a && root && root.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=="file"); };
function renderSoft(){
  S.ver++; setSync();
  if(S.tab==="scout"){ const box=$("#assignBox"); if(box) box.innerHTML=assignCard(); }
  else if(isTyping($("#main"))) S.dirty = true;
  else { const y=scrollY; render(); scrollTo(0,y); return; }
  if(isTyping($("#overlayRoot"))) S.panelDirty = true; else renderTeam();
}
document.addEventListener("focusout", () => setTimeout(() => {
  if(S.dirty && !isTyping($("#main"))){ const y=scrollY; render(); scrollTo(0,y); }
  if(S.panelDirty && !isTyping($("#overlayRoot"))){ S.panelDirty=false; renderTeam(); }
}, 0));

function setSync(){
  const c=$("#syncChip"), t=$("#syncTxt"); const q=S.queue.length; let cls="ok", txt;
  if(S.connecting){ cls=""; txt="Connecting…"; }
  else if(S.backend==="local" && HAS_FB && S.wkey){ cls="warn"; txt = q ? `Not connected · ${q} waiting` : "Not connected"; }
  else if(S.backend==="local"){ cls="warn"; txt = "This device only"; }
  else if(S.backend==="firebase"){
    if(!navigator.onLine){ cls="warn"; txt="Offline · saving on device"; }
    else if(S.pending||q){ cls="warn"; txt=`Syncing ${S.pending+q}…`; }
    else txt="Live · synced";
  } else {
    if(!S.live){ cls="warn"; txt = q ? `Offline · ${q} waiting` : "Offline"; }
    else if(q){ cls="warn"; txt=`${q} waiting to sync`; }
    else txt = S.readOnly ? "Live · view only" : "Live · synced";
  }
  c.className = "chip "+cls; t.textContent = txt;
  $("#evtName").textContent = S.showAll ? "All" : S.event;
}

function timerIdle(){ return `<div class="timer"><div><div class="ph">Match timer</div><div style="font-size:13px;opacity:.75">Start it when the match starts. It tracks auto, the hub shifts and end game, and keeps your screen awake.</div></div><button class="btn" data-act="timer">Start</button></div>`; }
function timerHTML(){
  const t = Math.min(160, (Date.now()-S.timer.start)/1000);
  const ph = PHASES.find(p=>t>=p[0]&&t<p[1]) || PHASES[PHASES.length-1];
  const left = Math.max(0, Math.ceil(160-t)); const mm=Math.floor(left/60), ss=String(left%60).padStart(2,"0");
  const inPh = Math.max(0, Math.ceil(ph[1]-t));
  return `<div class="timer"><span class="t">${mm}:${ss}</span><div><div class="ph">${t>=160?"Match over":esc(ph[2])}</div><div style="font-size:13px;opacity:.75">${t>=160?"Finish the form and submit":inPh+"s left in phase"}</div></div><button class="btn" data-act="timerStop">${t>=160?"Close":"Stop"}</button><div class="bar"><i style="width:${t/160*100}%"></i></div></div>`;
}
let lastPhase=null;
function tick(){
  if(!S.timer) return;
  const box=$("#timerBox"); if(box) box.innerHTML=timerHTML();
  const t=(Date.now()-S.timer.start)/1000;
  const ph=(PHASES.find(p=>t>=p[0]&&t<p[1])||[])[2];
  if(ph!==lastPhase && S.tab==="scout"){
    if(ph==="Transition") $("#s-tele")?.scrollIntoView({behavior:"smooth",block:"start"});
    if(ph==="End game") $("#s-end")?.scrollIntoView({behavior:"smooth",block:"center"});
    lastPhase=ph;
  }
  if(t>=160){ clearInterval(S.timer.id); S.timer.id=null; releaseWake(); }
}
async function startTimer(){
  S.timer={start:Date.now()}; lastPhase="Auto"; S.timer.id=setInterval(tick,250); tick();
  try{ S.wake = await navigator.wakeLock?.request("screen"); }catch{}
  $("#s-auto")?.scrollIntoView({behavior:"smooth",block:"start"});
}
function releaseWake(){ try{ S.wake?.release(); }catch{} S.wake=null; }

// ---------- charts ----------
function niceStep(v){ const p=10**Math.floor(Math.log10(Math.max(v,1e-9))); for(const m of [1,2,5,10]) if(m*p>=v) return m*p; return 10*p; }
function lineChart(series, opts={}){
  const all = series.flatMap(s=>s.points);
  if(!all.length) return `<p class="muted">No matches to chart yet.</p>`;
  // size the drawing to the screen so axis text stays readable on phones
  const W=Math.round(Math.min(640, Math.max(300, innerWidth-80))), H=Math.round(W*0.42)+40, L=40, R=opts.direct?44:16, T=12, B=30;
  const xs = [...new Set(all.map(p=>p.x))].sort((a,b)=>a-b), xi = new Map(xs.map((x,i)=>[x,i])), n = xs.length;
  const X = x => n===1 ? L+(W-L-R)/2 : L + xi.get(x)*(W-L-R)/(n-1);
  const step = niceStep(Math.max(10, ...all.map(p=>p.y))/4), ymax = Math.max(step, Math.ceil(Math.max(10, ...all.map(p=>p.y))/step)*step);
  const Y = y => T + (H-T-B)*(1-y/ymax);
  let g = "";
  for(let v=0; v<=ymax+1e-9; v+=step) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`;
  const every = Math.ceil(n/Math.max(3, Math.floor((W-L-R)/48)));
  xs.forEach((x,i) => { if(i%every===0 || i===n-1) g += `<text class="ax" x="${X(x)}" y="${H-10}" text-anchor="middle">Q${x}</text>`; });
  if(opts.avg!=null){ const ay=Y(opts.avg); g += `<line class="avg" x1="${L}" x2="${W-R}" y1="${ay}" y2="${ay}"/><text class="ax" x="${W-R}" y="${ay-5}" text-anchor="end">avg ${f1(opts.avg)}</text>`; }
  series.forEach(s => {
    const pts = s.points.slice().sort((a,b)=>a.x-b.x);
    if(pts.length>1) g += `<path d="${pts.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p => { g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
    if(opts.direct && pts.length){ const p=pts[pts.length-1]; g += `<text class="dl" x="${X(p.x)+8}" y="${Y(p.y)+4}">${esc(s.label)}</text>`; }
  });
  series.forEach(s => s.points.forEach(p => { g += `<circle class="hit" cx="${X(p.x)}" cy="${Y(p.y)}" r="12" data-tip="${esc((series.length>1?s.label+" · ":"")+p.tip)}"/>`; }));
  const keys = series.length>1 ? `<div class="keys">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>` : "";
  return `<div class="chart">${keys}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"Chart")}">${g}</svg></div>`;
}
const seriesPts = r => r.series.map(p => ({x:p.x, y:p.y, tip:`Q${p.x}: ${f1(p.y)} pts · ${f1(p.fuel)} fuel · ${LBL[p.climb]||"no climb"}`}));

function vCompare(){
  const slots = S.compare, ts = slots.filter(Boolean), rows = rankAll();
  const quick = rows.filter(r=>!ts.includes(r.team)).slice(0,10);
  const add = `<section class="sec"><div class="sec-h"><h2>Compare teams</h2><span class="tag">Up to 4</span></div>
    <div class="row"><input type="number" id="cmp-in" data-keep="cmp" inputmode="numeric" placeholder="Team #" value="${esc(draft("cmp",""))}" style="flex:1;min-width:120px"><button class="btn" data-act="cmpAdd" ${ts.length>=4?"disabled":""}>Add</button></div>
    ${ts.length?`<div class="row">${slots.map((t,i)=>t?`<span class="pill"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--s${i+1});margin-right:6px"></i>${esc(t)} <button class="btn sm" data-act="cmpRm" data-i="${i}" aria-label="Remove ${esc(t)}" style="padding:0 6px;border:0;background:none">✕</button></span>`:"").join("")}</div>`:""}
    ${quick.length && ts.length<4?`<div class="row"><span class="lbl">Top teams:</span>${quick.map(r=>`<button class="btn sm" data-act="cmpQuick" data-t="${esc(r.team)}"><span class="mono">${esc(r.team)}</span></button>`).join("")}</div>`:""}
  </section>`;
  if(!ts.length) return `<div class="view">${add}<section class="sec"><div class="empty"><h3>Pick teams to compare</h3><p>Add two to four teams to see their stats side by side, with the best value in each row highlighted and their scoring trends on one chart.</p></div></section></div>`;
  const st = slots.map(t => t ? statsFor(t) : null);
  const M = [
    ["Rank", r=>r.rank, -1, v=>v??"—"], ["Score", r=>r.score, 1, f1], ["Avg points", r=>r.pts, 1, f1], ["Auto points", r=>r.auto, 1, f1],
    ["Fuel / match", r=>r.fuel, 1, f1], ["Fuel / volley", r=>r.perVolley, 1, f1], ["Accuracy", r=>r.acc, 1, pct], ["Tower points", r=>r.tower, 1, f1],
    ["Climb rate", r=>r.climbRate, 1, pct], ["Best climb", r=>({none:0,L1:1,L2:2,L3:3}[r.bestClimb]||0), 1, v=>["—","Level 1","Level 2","Level 3"][v]],
    ...RATINGS.map(([k,l]) => [l, r=>r.ratings[k], 1, f1]), ["Issue rate", r=>r.issues, -1, pct], ["Reports", r=>r.n, 0, v=>v]
  ];
  const head = `<tr><th class="l">Stat</th>${slots.map((t,i)=>t?`<th><span class="team-n" style="color:var(--fg)">${esc(t)}</span><br><span class="legend" style="text-transform:none;letter-spacing:0">${esc(teamName(t))}</span></th>`:"").join("")}</tr>`;
  const body = M.map(([lab, fn, dir, fmt]) => {
    const vals = st.map(r => r ? fn(r) : null), live = vals.filter(v=>v!=null);
    const best = dir===0 || live.length<2 ? null : dir>0 ? Math.max(...live) : Math.min(...live);
    return `<tr><td class="l">${esc(lab)}</td>${st.map((r,i)=> r ? `<td class="num${best!=null&&vals[i]===best?" best":""}">${esc(fmt(vals[i]))}</td>` : "").join("")}</tr>`;
  }).join("") + `<tr><td class="l">Drive · aim · flow</td>${st.map(r=>r?`<td>${esc([LBL[r.drive],LBL[r.aim],LBL[r.flow]].filter(Boolean).join(" · ")||"—")}</td>`:"").join("")}</tr>`;
  const chart = lineChart(slots.map((t,i)=>t?{label:t, color:`var(--s${i+1})`, points:seriesPts(st[i])}:null).filter(Boolean), {direct:true, label:"Points per match for compared teams"});
  return `<div class="view">${add}
  <section class="sec"><div class="sec-h"><h2>Points per match</h2><span class="tag">Scouted, by match number</span></div>${chart}</section>
  <div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <p class="legend">Green marks the best value in each row. Tap a team in Rankings for its full profile.</p></div>`;
}

function vBrief(){

  }
  const custom = S.brief==="custom" || !ms.length;
  const m = custom ? null : ms.find(x=>x.n===S.brief);
  const red = custom ? S.briefTeams.red.filter(Boolean) : m ? m.red.map(String) : [];
  const blue = custom ? S.briefTeams.blue.filter(Boolean) : m ? m.blue.map(String) : [];
  const sel = `<section class="sec"><div class="sec-h"><h2>Pre-match brief</h2><span class="tag">Predicted from scouting</span></div>
    ${ms.length?`<label class="f">Match<select id="b-match">${ms.map(x=>`<option value="${x.n}" ${S.brief===x.n?"selected":""}>Q${x.n}${our&&[...x.red,...x.blue].map(String).includes(our)?" ★ our match":""}${played(x)?" (played)":""}</option>`).join("")}<option value="custom" ${custom?"selected":""}>Custom teams…</option></select></label>`:`<p class="legend">No schedule yet, so type the teams in. Import a schedule in Matches → Schedule to pick matches from a list.</p>`}
    ${custom?`<div class="grid2">${["red","blue"].map(al=>`<div class="stack"><span class="lbl">${al==="red"?"Red":"Blue"} alliance</span><div class="row">${[0,1,2].map(i=>`<input type="number" inputmode="numeric" id="bt-${al}-${i}" data-bt="${al}-${i}" value="${esc(S.briefTeams[al][i])}" placeholder="Team" style="flex:1;min-width:70px">`).join("")}</div></div>`).join("")}</div><button class="btn" data-act="briefGo" style="justify-self:start">Show brief</button>`:""}

// ---------- QR transfer ----------
const enc = e => QF.map(k => { const v=e[k]; if(BOOLF.has(k)) return v?1:0; if(k==="broken") return (v||[]).join("|"); if(k==="notes") return String(v||"").slice(0,1200); return v ?? ""; });
function dec(a){
  const e = {}; QF.forEach((k,i) => { let v=a[i]; if(BOOLF.has(k)) v=!!v; else if(k==="broken") v = v ? String(v).split("|").filter(Boolean) : []; else if(NUMF.has(k)) v=num(v); else v = v==null ? "" : String(v); e[k]=v; });
  e.team = String(e.team); if(!e.climb) e.climb="none"; if(!e.card) e.card="none"; return e;
}
const pack = arr => "RS1" + JSON.stringify(arr).replace(/[\u007f-￿]/g, c => "\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"));
function qrEntries(){
  const es = entriesNow();
  if(S.qrMode==="all") return es;
  const mine = new Set(S.mine), me = norm(S.form.scoutName);
  return es.filter(e => mine.has(e.id) || (me && norm(e.scoutName)===me));
}
function chunks(list){
  const out=[]; let cur=[];
  list.forEach(e => { const a=enc(e); if(cur.length && pack([...cur,a]).length>900){ out.push(pack(cur)); cur=[]; } cur.push(a); });
  if(cur.length) out.push(pack(cur)); return out;
}
function vTransfer(){
  const camOK = SITE && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  return `<div class="view">
  <section class="sec"><div class="sec-h"><h2>Send reports</h2><span class="tag">No internet needed</span></div>
    <p class="legend">Show these codes to the head scout's device. Their app scans them and adds any reports it doesn't have yet.</p>
    <div class="seg">${[["mine","My reports"],["all","Every report at this event"]].map(([v,l])=>`<button type="button" data-act="qrMode" data-v="${v}" ${pressed(S.qrMode===v)}>${l}</button>`).join("")}</div>
    <div id="qrBox" class="qrwrap"><p class="muted">Making codes…</p></div>
  </section>
  <section class="sec"><div class="sec-h"><h2>Receive reports</h2><span class="tag">Head scout</span></div>
    <div class="row">${camOK?`<button class="btn primary" data-act="scan">${S.scan?"Stop camera":"Scan with camera"}</button>`:""}
    <label class="btn" for="qr-photo">Scan from a photo</label><input type="file" id="qr-photo" accept="image/*" capture="environment" hidden></div>
    <video id="scanVid" class="scan" playsinline muted ${S.scan?"":"hidden"}></video>
    <p class="legend" id="scanMsg">${S.scan?"Point the camera at a code. Hold steady about a foot away.":camOK?"":"Take a photo of the code with your camera, then pick it here."}</p>
  </section></div>`;
}
async function renderQR(){
  const box = $("#qrBox"); if(!box) return;
  const list = qrEntries();
  if(!list.length){ box.innerHTML = `<p class="muted">${S.qrMode==="mine"?"You haven't submitted any reports at this event on this device yet.":"No reports at this event yet."}</p>`; return; }
  const cs = chunks(list); S.qrIdx = Math.min(S.qrIdx, cs.length-1);
  try{ await loadScript(LIB.qr); }
  catch{ box.innerHTML = `<p class="banner">Couldn't load the QR tool. Open the app once with internet so it's saved for offline use.</p>`; return; }
  if(!$("#qrBox")) return;
  const q = window.qrcode(0, "L"); q.addData(cs[S.qrIdx]); q.make();
  const per = cs.map(c => JSON.parse(c.slice(3)).length);
  box.innerHTML = `<img class="qr" src="${q.createDataURL(6, 2)}" alt="QR code ${S.qrIdx+1} of ${cs.length}">
    <div class="row" style="justify-content:center"><button class="btn" data-act="qrPrev" ${S.qrIdx===0?"disabled":""}>← Prev</button><span class="mono">Code ${S.qrIdx+1} of ${cs.length} · ${per[S.qrIdx]} report${per[S.qrIdx]>1?"s":""}</span><button class="btn" data-act="qrNext" ${S.qrIdx>=cs.length-1?"disabled":""}>Next →</button></div>
    <p class="legend">${list.length} report${list.length>1?"s":""} in ${cs.length} code${cs.length>1?"s":""}. Turn your screen brightness up.</p>`;
}
async function receive(text){
  if(!text || !text.startsWith("RS1")) return null;
  if(S.seen.has(text)) return -1; S.seen.add(text);
  let arr; try{ arr = JSON.parse(text.slice(3)); }catch{ return null; }
  const have = coll("entries"); let n = 0;
  for(const a of arr){ const e = dec(a); if(!e.id) continue; e.id = safeSeg(e.id); if(have.has(e.id)) continue; await write("set","entries/"+e.id, e); n++; }
  return n;
}
function reportScan(n){
  const msg = $("#scanMsg");
  if(n===null){ toast("That QR code isn't from REBUILT Scout."); return; }
  if(n===-1) return;
  buzz(); const t = n ? `Imported ${n} new report${n>1?"s":""}.` : "Already had those reports.";
  toast(t); if(msg) msg.textContent = t + " Scan the next code when ready.";
}
async function startScan(){
  try{
    await loadScript(LIB.jsqr);
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
    S.scan = {stream}; render();
    const v = $("#scanVid"); v.srcObject = stream; await v.play();
    const cv = document.createElement("canvas"), ctx = cv.getContext("2d", {willReadFrequently:true});
    let busy = false;
    S.scan.timer = setInterval(async () => {
      if(busy || !v.videoWidth) return; busy = true;
      try{
        const w = Math.min(800, v.videoWidth), h = Math.round(v.videoHeight*w/v.videoWidth);
        cv.width=w; cv.height=h; ctx.drawImage(v,0,0,w,h);
        const code = window.jsQR(ctx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:"dontInvert"});
        if(code) reportScan(await receive(code.data));
      } finally { busy = false; }
    }, 250);
  }catch(e){ stopScan(); toast("Couldn't open the camera. Allow camera access, or use Scan from a photo."); }
}
function stopScan(){ if(!S.scan) return; clearInterval(S.scan.timer); try{ S.scan.stream.getTracks().forEach(t=>t.stop()); }catch{} S.scan=null; const v=$("#scanVid"); if(v){ v.hidden=true; v.srcObject=null; } }
async function scanFile(file){
  try{
    await loadScript(LIB.jsqr);
    const bmp = await createImageBitmap(file); const sc = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width*sc), h = Math.round(bmp.height*sc), cv = document.createElement("canvas"); cv.width=w; cv.height=h;
    const ctx = cv.getContext("2d"); ctx.drawImage(bmp,0,0,w,h);
    const code = window.jsQR(ctx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:"attemptBoth"});
    if(!code){ toast("No QR code found in that photo. Try again closer and in focus."); return; }
    S.seen.delete(code.data); reportScan(await receive(code.data));
  }catch{ toast("Couldn't read that photo."); }
}

async function submitMatch(){
  const F=S.form;
  if(!F.team || !F.match){ toast("Enter the match number and team number first."); $(!F.match?"#f-match":"#f-team")?.focus(); return; }
  if(!F.scoutName.trim()){ toast("Add your name so the team knows who scouted this."); $("#f-scoutName")?.focus(); return; }
  const id = `${evKey()}_${num(F.match)}_${num(F.team)}_${rid()}`;
  const e = {...F, id, event:S.event, team:String(num(F.team)), match:num(F.match), scoutName:F.scoutName.trim(), scoutId:S.uid||null, ts:Date.now()};
  ["autoFuel","autoMiss","teleFuel","teleMiss","volleys","fouls",...RATINGS.map(r=>r[0])].forEach(k=>e[k]=num(e[k]));
  const res = await write("set", "entries/"+id, e);
  if(res===false) return;
  S.mine = [...S.mine.slice(-400), id]; ls.set("mine", S.mine);
  toast(res==="queued" ? `Saved on this device. Team ${e.team} uploads when you're back online.` : res==="local" ? `Team ${e.team}, match ${e.match} saved on this device.` : `Team ${e.team}, match ${e.match} saved.`);
  ls.set("scoutName", F.scoutName.trim());
  S.form = blankForm(F); saveDraft();
  if(S.timer?.id) clearInterval(S.timer.id); S.timer=null; releaseWake();
  render(); scrollTo(0,0);
}
async function savePit(){

  const k=String(num(p.num)); const old=teamsNow().get(k)||{};
  const events=[...new Set([...(old.events||[]), S.event])];
  const {id, ...rest} = {...old, ...p};
  const res = await write("set","teams/"+k,{...rest,num:k,events,ts:Date.now(),by:S.form.scoutName||""});

async function tbaImport(){
  const C = cfg(), key = String(C.tbaKey||"").trim(), ev = S.event.trim().toLowerCase();
  if(!key){ toast("Add a TBA read key in More → Setup."); return; }
  toast(`Loading ${ev} from The Blue Alliance…`);
  const get = async path => { const r = await fetch(`https://www.thebluealliance.com/api/v3/${path}`, {headers:{"X-TBA-Auth-Key":key}}); if(!r.ok) throw r.status; return r.json(); };
  try{
    const [ms, ts] = await Promise.all([get(`event/${ev}/matches/simple`), get(`event/${ev}/teams/simple`)]);
    const matches = ms.filter(m=>m.comp_level==="qm").sort((a,b)=>a.match_number-b.match_number).map(m=>({
      n:m.match_number, red:m.alliances.red.team_keys.map(k=>k.replace("frc","")), blue:m.alliances.blue.team_keys.map(k=>k.replace("frc","")),
      rs:m.alliances.red.score??-1, bs:m.alliances.blue.score??-1, t:m.predicted_time||m.time||null }));
    const names = {}; ts.forEach(t => names[t.team_number] = t.nickname || "");
    await write("set","schedule/"+evKey(), {matches, names, source:"tba", ts:Date.now()});
    toast(matches.length ? `Imported ${matches.length} matches and ${ts.length} teams.` : `Imported ${ts.length} teams. The match schedule isn't posted yet; try again later.`);
    render();
  }catch(e){
    toast(e===401 ? "The Blue Alliance rejected the key. Check it in More → Setup." : e===404 ? `No event "${ev}" on The Blue Alliance. Use the TBA event key as your event code.` : "Couldn't reach The Blue Alliance. Check your connection.");
  }
}
async function pasteSchedule(){
  const txt = $("#sch-paste").value; const matches = [];
  txt.split(/\n/).forEach(line => { const n = (line.match(/\d+/g)||[]).map(Number); if(n.length>=7) matches.push({n:n[0], red:n.slice(1,4).map(String), blue:n.slice(4,7).map(String), rs:-1, bs:-1}); });
  if(!matches.length){ toast("No matches found. Each line needs 7 numbers."); return; }
  const old = scheduleFor() || {};
  await write("set","schedule/"+evKey(), {matches, names:old.names||{}, source:"manual", ts:Date.now()});
  delete S.drafts.schPaste; toast(`Saved ${matches.length} matches.`); render();
}

function csvOf(rows){ return rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\n"); }
async function offer(filename, data){
  if(SITE){
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type: filename.endsWith(".json") ? "application/json" : "text/csv"}));
    a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); return;
  }
  let dl=null; try{ dl = await window.claude?.use?.("downloads"); }catch{}
  if(!dl){ toast("Downloads aren't available in this view."); return; }
  try{ await dl.save({filename, data}); }catch(e){ if(e?.code!=="declined") toast("Couldn't save the file."); }
}

  if(d.evt){ setEvent(d.evt); toast(`Switched to ${d.evt}.`); return; }
  if(d.pl){
    const pl=picklist(), t=d.t, i=pl.order.indexOf(t);
    if(d.pl==="add" && i<0) pl.order.push(t);
    if(d.pl==="addAll") rankAll().forEach(r=>{ if(!pl.order.includes(r.team)) pl.order.push(r.team); });
    if(d.pl==="rm") pl.order.splice(i,1);
    if(d.pl==="up" && i>0) [pl.order[i-1],pl.order[i]]=[pl.order[i],pl.order[i-1]];
    if(d.pl==="down" && i<pl.order.length-1) [pl.order[i+1],pl.order[i]]=[pl.order[i],pl.order[i+1]];
    if(d.pl==="dnp") pl.dnp = pl.dnp.includes(t) ? pl.dnp.filter(x=>x!==t) : [...pl.dnp,t];
    await savePick(pl); if(d.pl==="add" && S.openTeam) toast(`Team ${t} added to the picklist.`); return;
  }
  switch(d.act){
    case "timer": startTimer(); break;
    case "timerStop": if(S.timer?.id) clearInterval(S.timer.id); S.timer=null; releaseWake(); $("#timerBox").innerHTML=timerIdle(); break;
    case "submit": submitMatch(); break;
    case "clear": if(b.dataset.armed){ const m=F.match; S.form=blankForm(); S.form.match=m; saveDraft(); render(); } else { b.dataset.armed="1"; b.textContent="Tap again to clear"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="Clear form"; } },3000); } break;
    case "fillAssign": { const sch=scheduleFor(); const m=sch&&sch.matches.find(x=>x.n===num(d.m)); if(!m) return; const p=d.p;
      Object.assign(F, {match:String(m.n), team:teamAt(m,p), alliance:p[0]==="R"?"red":"blue", station:p[1]}); saveDraft(); render(); $("#s-setup")?.scrollIntoView({block:"start"}); break; }
    case "pitSave": savePit(); break;
    case "pitClear": S.pit=null; render(); break;
    case "editPit": { const t=d.t; S.pit={...blankPit(), name:teamName(t), ...(teamsNow().get(t)||{}), num:t}; S.openTeam=null; renderTeam(); S.sub.scout="pit"; setTab("scout"); break; }
    case "closeTeam": if(ev.target===b || b.tagName==="BUTTON"){ S.openTeam=null; S.confirmDel=null; renderTeam(); } break;
    case "addNote": { const text=$("#n-text").value.trim(); if(!text){ toast("Write the note first."); return; }
      const id=rid(), tag=(S.noteDraft||{}).tag||"weakness";
      const res=await write("set","notes/"+id,{id,team:d.t,text,tag,event:S.event,scoutName:S.form.scoutName||ls.get("scoutName",""),scoutId:S.uid||null,ts:Date.now()});
      if(res!==false){ S.noteDraft={text:"",tag}; toast("Note added."); renderTeam(); } break; }
    case "delNote": await write("delete","notes/"+d.id); renderTeam(); break;
    case "delEntry": if(S.confirmDel===d.id){ S.confirmDel=null; await write("delete","entries/"+d.id); toast("Report deleted."); renderSoft(); renderTeam(); } else { S.confirmDel=d.id; renderTeam(); } break;
    case "cmpToggle": { const t=d.t, i=S.compare.indexOf(t); if(i>=0) S.compare[i]=null; else { const j=S.compare.indexOf(null); if(j<0){ toast("Compare holds 4 teams. Remove one first."); return; } S.compare[j]=t; } ls.set("compare",S.compare); renderTeam(); if(S.tab==="teams") render(); toast(i>=0?"Removed from compare.":`Team ${t} added to Teams → Compare.`); break; }
    case "cmpAdd": case "cmpQuick": { const t=String(num(d.act==="cmpQuick"?d.t:$("#cmp-in").value)); if(t==="0"){ toast("Enter a team number."); return; } if(S.compare.includes(t)) return; const j=S.compare.indexOf(null); if(j<0) return; S.compare[j]=t; ls.set("compare",S.compare); delete S.drafts.cmp; render(); break; }
    case "cmpRm": S.compare[num(d.i)]=null; ls.set("compare",S.compare); render(); break;
    case "briefGo": render(); break;
    case "roSave": { const scouts=[...new Set($("#ro-names").value.split(/\n/).map(s=>s.trim()).filter(Boolean))]; const shift=Math.max(1,num($("#ro-shift").value)||6);
      const r=await write("set","roster/"+evKey(),{scouts,shift,ts:Date.now()}); if(r!==false){ delete S.drafts.roNames; delete S.drafts.roShift; toast(`Roster saved: ${scouts.length} scouts.`); render(); } break; }
    case "onlyMe": S.onlyMe=!S.onlyMe; render(); break;
    case "tba": tbaImport(); break;
    case "schPaste": pasteSchedule(); break;
    case "qrMode": S.qrMode=d.v; S.qrIdx=0; render(); break;
    case "qrPrev": S.qrIdx=Math.max(0,S.qrIdx-1); renderQR(); break;
    case "qrNext": S.qrIdx++; renderQR(); break;
    case "scan": if(S.scan){ stopScan(); render(); } else startScan(); break;
    case "saveEvent": { const v=$("#d-event").value.trim(); if(!v){ toast("Enter an event code."); return; } setEvent(v); toast(`Now scouting ${v}.`); break; }
    case "showAll": S.showAll=!S.showAll; subscribeEntries(); render(); break;
    case "saveCfg": case "resetCfg": {
      let c;
      if(d.act==="resetCfg") c={...DEFAULT_CFG, ourTeam:cfg().ourTeam, tbaKey:cfg().tbaKey};
      else { c={...cfg()}; NUM_CFG.forEach(k=>{ const el=$("#c-"+k); if(el) c[k]=num(el.value); }); const o=$("#c-ourTeam"); if(o) c.ourTeam=String(o.value||"").trim(); const tk=$("#c-tbaKey"); if(tk) c.tbaKey=String(tk.value||"").trim(); }
      const r=await write("set","config/scoring",c);
      if(r!==false){ S.cfg=c; Object.keys(S.drafts).filter(k=>k.startsWith("c-")).forEach(k=>delete S.drafts[k]); toast(d.act==="resetCfg"?"Scoring reset.":"Saved for the whole team."); render(); } break; }
    case "flush": flush(); break;
    case "join": { const v=String($("#w-code").value||"").trim(); const m=v.match(/team=([A-Za-z0-9]+)/); const code=m?m[1]:v.replace(/[^A-Za-z0-9]/g,""); if(code.length<16){ toast("That team code looks too short. Paste the whole code or invite link."); return; } ls.set("wkey",code); location.reload(); break; }
    case "createWs": { const a=new Uint8Array(16); crypto.getRandomValues(a); const code=[...a].map(x=>x.toString(16).padStart(2,"0")).join(""); ls.set("wkey",code); location.reload(); break; }
    case "copyLink": { const el=$("#w-link"); try{ await navigator.clipboard.writeText(el.value); toast("Invite link copied."); }catch{ el.select(); toast("Select the link and copy it."); } break; }
    case "leaveWs": if(S.confirmLeave){ ls.set("wkey",""); location.reload(); } else { S.confirmLeave=true; render(); setTimeout(()=>{ S.confirmLeave=false; },4000); } break;
    case "install": if(S.installEvt){ S.installEvt.prompt(); try{ await S.installEvt.userChoice; }catch{} S.installEvt=null; render(); } break;
    case "csv": { const es=[...coll("entries").values()].sort((a,b)=>String(a.event).localeCompare(String(b.event))||num(a.match)-num(b.match));
      const cols=["event","match","team","alliance","station","scoutName","noShow","autoLeave","autoFuel","autoMiss","autoClimb","teleFuel","teleMiss","volleys","flow","aim","drive","defense","bump","trench","climb",...RATINGS.map(r=>r[0]),"m_died","m_stuck","m_tipped","m_broke","broken","fouls","card","notes"];
      await offer(`rebuilt-scouting-${evKey()}.csv`, csvOf([[...cols,"points"],...es.map(e=>[...cols.map(c=>Array.isArray(e[c])?e[c].join("|"):e[c]),entryPts(e)])])); break; }
    case "csvRank": { const rows=rankAll();
      await offer(`rebuilt-rankings-${evKey()}.csv`, csvOf([["rank","team","name","score","avg_points","auto_points","fuel_per_match","fuel_per_volley","accuracy","tower_points","climb_rate","best_climb","rating","issue_rate","aim","flow","drive","reports"],
        ...rows.map(r=>[r.rank,r.team,teamName(r.team),f1(r.score),f1(r.pts),f1(r.auto),f1(r.fuel),f1(r.perVolley),r.acc==null?"":Math.round(r.acc*100),f1(r.tower),r.climbRate==null?"":Math.round(r.climbRate*100),r.bestClimb,f1(r.rating),r.issues==null?"":Math.round(r.issues*100),r.aim||"",r.flow||"",r.drive||"",r.n])])); break; }
    case "json": { const dump = n => [...coll(n).entries()].map(([k,v])=>({...v,id:k}));
      await offer(`rebuilt-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({app:"rebuilt-scout",version:2,entries:dump("entries"),teams:dump("teams"),notes:dump("notes"),picklists:dump("picklist"),schedules:dump("schedule"),rosters:dump("roster"),config:cfg()})); break; }
  }
});
document.addEventListener("input", ev => {
  const el=ev.target, d=el.dataset;
  if(d.f){ S.form[d.f]=el.value; saveDraft(); }
  if(d.p){ S.pit[d.p]=el.value; }
  if(d.keep){ S.drafts[d.keep]=el.value; }
  if(d.bt){ const [al,i]=d.bt.split("-"); S.briefTeams[al][num(i)]=String(el.value||"").trim(); }
  if(el.id==="f-filter"){ S.filter=el.value; const pos=el.selectionStart; render(); const n=$("#f-filter"); n.focus(); try{n.setSelectionRange(pos,pos);}catch{} }
  if(el.id==="n-text"){ S.noteDraft={...(S.noteDraft||{tag:"weakness"}), text:el.value}; }
});
document.addEventListener("change", async ev => {
  const el=ev.target;
  if(el.id==="f-scoutName"){ ls.set("scoutName", el.value.trim()); const box=$("#assignBox"); if(box) box.innerHTML=assignCard(); }
  if(el.id==="p-num"){ const k=String(num(el.value)); const t=teamsNow().get(k); if(t){ S.pit={...blankPit(),...t,num:k}; render(); toast(`Loaded team ${k}'s profile.`); } else if(!S.pit.name && teamName(k)){ S.pit.name=teamName(k); const n=$("#p-name"); if(n) n.value=S.pit.name; } }
  if(el.id==="b-match"){ S.brief = el.value==="custom" ? "custom" : num(el.value); render(); }
  if(el.id==="qr-photo" && el.files?.[0]){ await scanFile(el.files[0]); el.value=""; }
  if(el.id==="d-import" && el.files?.[0]){
    try{
      const data=JSON.parse(await el.files[0].text()); let n=0;
      const put = async (c, list, keyOf) => { for(const x of list||[]){ const k=keyOf(x); if(!k) continue; const {id, ...rest} = x; await write("set", `${c}/${safeSeg(k)}`, c==="entries"||c==="notes" ? {...x, id:safeSeg(k)} : rest); n++; } };
      await put("entries", data.entries, x=>x&&x.id); await put("teams", data.teams, x=>x&&(x.num||x.id)); await put("notes", data.notes, x=>x&&x.id);
      await put("picklist", data.picklists, x=>x&&x.id); await put("schedule", data.schedules, x=>x&&x.id); await put("roster", data.rosters, x=>x&&x.id);
      toast(`Restored ${n} records.`); render();
    }catch{ toast("That file isn't a REBUILT Scout backup."); }
    el.value="";
  }
});
document.addEventListener("keydown", ev => { if(ev.key==="Escape" && S.openTeam){ S.openTeam=null; renderTeam(); } });
// chart tooltips
const tip = $("#tip");
document.addEventListener("pointerover", ev => { const h=ev.target.closest && ev.target.closest("[data-tip]"); if(!h){ tip.hidden=true; return; } tip.textContent=h.dataset.tip; tip.hidden=false; placeTip(ev); });
document.addEventListener("pointermove", ev => { if(!tip.hidden) placeTip(ev); });
function placeTip(ev){ const w=tip.offsetWidth, x=Math.min(innerWidth-w-8, Math.max(8, ev.clientX-w/2)); tip.style.left=x+"px"; tip.style.top=Math.max(8, ev.clientY-44)+"px"; }
addEventListener("scroll", () => { tip.hidden=true; }, {passive:true, capture:true});

// ---------- backends ----------
function subscribeColl(name, q){
  return q.onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { const x = d.data(); m.set(d.id, {...x, id:x.id||d.id}); });
    S.c[name] = m; S.live = true; renderSoft();
  }, err => { if(S.backend==="claude"){ S.live=false; setSync(); } else if(err && err.code==="permission-denied") toast("The team database refused access. Check the team code in More → Setup."); });
}
function subscribeEntries(){
  if(!S.db) return;
  if(S.entriesUnsub) S.entriesUnsub();
  const c = S.db.collection("entries");
  S.entriesUnsub = subscribeColl("entries", S.showAll ? c : c.where("event","==",S.event));
}
function subscribeAll(){
  subscribeEntries();
  COLLS.filter(n=>n!=="entries").forEach(n => subscribeColl(n, S.db.collection(n)));
  S.db.doc("config/scoring").onSnapshot(s => { S.cfg = s.exists ? {...DEFAULT_CFG, ...s.data()} : {...DEFAULT_CFG}; renderSoft(); }, ()=>{});
}
let fbStarting = false;
async function initFirebase(){
  if(fbStarting || S.db) return; fbStarting = true;
  try{
    for(const u of LIB.fb) await loadScript(u);
    const fb = window.firebase;
    if(!fb.apps.length){ fb.initializeApp(CONF.firebase); try{ await fb.firestore().enablePersistence({synchronizeTabs:true}); }catch{} }
    const auth = fb.auth();
    const user = await new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
    if(!user) await auth.signInAnonymously();
    S.uid = auth.currentUser.uid;
    const fs = fb.firestore(), base = `w/${S.wkey}`;
    S.db = { doc: p => fs.doc(`${base}/${p}`), collection: p => fs.collection(`${base}/${p}`) };
    S.backend = "firebase"; S.live = true;
    subscribeAll(); flush();
  }catch(e){
    console.warn("Team sync unavailable:", e);
    if(navigator.onLine) toast("Couldn't connect to team sync. Reports are saved on this device for now.");
  }finally{ fbStarting = false; S.connecting = false; setSync(); render(); }
}
async function initClaude(){
  if(!window.claude?.use){ S.connecting=false; setSync(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if(user){ S.uid = await user.id(); const cw = await user.can("data.write"); if(cw===false) S.readOnly=true; }
  S.connecting = false;
  if(!db){ setSync(); render(); return; }
  S.db = db; S.backend = "claude"; S.live = true; setSync();
  subscribeAll(); flush(); render();
}

// ---------- boot ----------
if(SITE){
  const p = new URLSearchParams(location.search).get("team");
  if(p && /^[A-Za-z0-9]{16,}$/.test(p)){ ls.set("wkey", p); S.wkey = p; history.replaceState(null, "", location.pathname); }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; if(S.tab==="more") render(); });
  if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
}
markNav(); render();
if(SITE){ if(HAS_FB && S.wkey) initFirebase(); else { S.connecting=false; setSync(); render(); } }
else initClaude();
})();
</script>
</body>
